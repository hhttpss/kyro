<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Producto | KYRO</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f5;
            color: #111;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .topbar {
            height: 78px;
            background: #050505;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            padding: 0 30px;
        }

        .back {
            position: absolute;
            left: 30px;

            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -2px;
        }

        .product-page {
            min-height: calc(100vh - 78px);

            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .image-area {
            background: #e9e9e7;
            min-height: calc(100vh - 78px);
            position: relative;
            overflow: hidden;
        }

        .gallery {
            width: 100%;
            height: 100%;
            min-height: calc(100vh - 78px);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #e9e9e7;
        }

        .gallery-main {
            width: 100%;
            height: 100%;
            min-height: calc(100vh - 78px);
            object-fit: cover;
            cursor: zoom-in;
            user-select: none;
            -webkit-user-drag: none;
        }

        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-arrow.prev {
            left: 18px;
        }

        .gallery-arrow.next {
            right: 18px;
        }

        .gallery-arrow:disabled {
            display: none;
        }

        .gallery-bottom {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 18px;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0 18px;
        }

        .gallery-thumbnails {
            display: flex;
            gap: 7px;
            max-width: calc(100% - 120px);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .gallery-thumbnails::-webkit-scrollbar {
            display: none;
        }

        .gallery-thumb {
            width: 44px;
            height: 54px;
            flex: 0 0 auto;
            border: 2px solid transparent;
            padding: 0;
            background: #ddd;
            cursor: pointer;
            opacity: 0.7;
        }

        .gallery-thumb.active {
            border-color: white;
            opacity: 1;
        }

        .gallery-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .gallery-counter,
        .zoom-button {
            border: none;
            background: rgba(0, 0, 0, 0.68);
            color: white;
            min-height: 34px;
            padding: 0 10px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .zoom-button {
            cursor: pointer;
        }

        .no-image {
            min-height: calc(100vh - 78px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #888;
            letter-spacing: 1px;
        }

        .zoom-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.96);
            display: none;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }

        .zoom-modal.active {
            display: flex;
        }

        .zoom-image {
            max-width: 92vw;
            max-height: 90vh;
            object-fit: contain;
            transform-origin: center center;
            transition: transform 0.15s ease;
            user-select: none;
            -webkit-user-drag: none;
        }

        .zoom-close,
        .zoom-control,
        .zoom-nav {
            position: absolute;
            z-index: 10;
            border: none;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            cursor: pointer;
        }

        .zoom-close {
            top: 18px;
            right: 18px;
            width: 44px;
            height: 44px;
            font-size: 28px;
        }

        .zoom-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .zoom-control {
            position: static;
            width: 44px;
            height: 44px;
            font-size: 20px;
        }

        .zoom-nav {
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 60px;
            font-size: 28px;
        }

        .zoom-nav.prev {
            left: 16px;
        }

        .zoom-nav.next {
            right: 16px;
        }

        .info-area {
            padding: 80px 70px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .category {
            font-size: 10px;
            color: #777;
            letter-spacing: 1.5px;
            text-transform: uppercase;

            margin-bottom: 15px;
        }

        .name {
            font-size: 44px;
            font-weight: 500;
            letter-spacing: -2px;

            margin-bottom: 18px;
        }

        .price {
            font-size: 22px;
            font-weight: 600;

            margin-bottom: 30px;
        }

        .description {
            font-size: 14px;
            color: #555;
            line-height: 1.7;

            margin-bottom: 30px;

            max-width: 500px;
        }

        .stock {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;

            margin-bottom: 30px;
        }

        .stock.available {
            color: #166534;
        }

        .stock.sold-out {
            color: #b91c1c;
        }

        .quantity-box {
            margin-bottom: 25px;
        }

        .quantity-box label {
            display: block;

            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;

            margin-bottom: 10px;
        }

        .quantity-box input {
            width: 90px;
            height: 45px;

            border: 1px solid #bbb;
            background: white;

            padding: 0 12px;

            font-size: 14px;
        }

        .buttons {
            display: flex;
            flex-direction: column;

            gap: 10px;

            max-width: 450px;
        }

        .btn {
            width: 100%;
            height: 54px;

            border: 1px solid #111;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;

            cursor: pointer;

            transition: 0.25s;
        }

        .cart-btn {
            background: #111;
            color: white;
        }

        .cart-btn:hover {
            background: #333;
        }

        .favorite-btn {
            background: transparent;
            color: #111;
        }

        .favorite-btn:hover {
            background: #111;
            color: white;
        }

        .favorite-btn.active {
            background: #111;
            color: white;
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .message {
            min-height: 18px;
            margin-top: 15px;

            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        .message.success {
            color: #166534;
        }

        .message.error {
            color: #b91c1c;
        }

        .loading,
        .error {
            padding: 80px 30px;
            text-align: center;
        }

        @media (max-width: 800px) {

            .topbar {
                height: 65px;
            }

            .back {
                left: 18px;
            }

            .logo {
                font-size: 25px;
            }

            .product-page {
                grid-template-columns: 1fr;
            }

            .image-area {
                min-height: 60vh;
            }

            .gallery,
            .gallery-main,
            .no-image {
                min-height: 60vh;
            }

            .gallery-arrow {
                width: 40px;
                height: 40px;
            }

            .gallery-bottom {
                bottom: 12px;
                padding: 0 12px;
            }

            .gallery-thumb {
                width: 38px;
                height: 48px;
            }

            .gallery-thumbnails {
                max-width: calc(100% - 105px);
            }

            .zoom-nav {
                width: 42px;
                height: 52px;
            }

            .info-area {
                padding: 45px 22px 60px;
            }

            .name {
                font-size: 34px;
            }

        }
    </style>
</head>

<body>

    <header class="topbar">

        <a href="catalogo.html" class="back">
            ← VOLVER
        </a>

        <a href="index.html" class="logo">
            KYRO
        </a>

    </header>


    <main id="contenido">

        <div class="loading">
            Cargando producto...
        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://nhdjeagtkziidkiewttf.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_65y75qbjj3WJxlSEG4d6Nw_8ipgOePE";


        const clienteSupabase =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const contenido =
            document.getElementById("contenido");


        const parametros =
            new URLSearchParams(
                window.location.search
            );


        const idProducto =
            parametros.get("id");


        async function cargarProducto() {

            if (!idProducto) {

                contenido.innerHTML = `
                    <div class="error">
                        Producto no encontrado.
                    </div>
                `;

                return;
            }


            const { data, error } =
                await clienteSupabase
                    .from("produtos")
                    .select("*")
                    .eq("id", idProducto)
                    .eq("activo", true)
                    .single();


            if (error || !data) {

                console.error(error);

                contenido.innerHTML = `
                    <div class="error">
                        No se pudo cargar el producto.
                    </div>
                `;

                return;
            }


            mostrarProducto(data);

        }


        function mostrarProducto(producto) {

            const precio =
                Number(producto.precio).toFixed(2);


            const stockDisponible =
                Number(producto.stock) > 0;


            let imagenes = [];

            if (
                Array.isArray(producto.imagenes) &&
                producto.imagenes.length > 0
            ) {
                imagenes = producto.imagenes.filter(Boolean);
            }

            if (
                producto.imagen &&
                !imagenes.includes(producto.imagen)
            ) {
                imagenes.unshift(producto.imagen);
            }

            imagenes = [...new Set(imagenes)];

            let galeriaHTML = `
                <div class="no-image">
                    SIN IMAGEN
                </div>
            `;

            if (imagenes.length > 0) {

                const miniaturas = imagenes
                    .map(
                        (url, indice) => `
                            <button
                                type="button"
                                class="gallery-thumb ${indice === 0 ? "active" : ""}"
                                data-gallery-index="${indice}"
                                aria-label="Ver imagen ${indice + 1}"
                            >
                                <img
                                    src="${url}"
                                    alt="${producto.nombre} ${indice + 1}"
                                >
                            </button>
                        `
                    )
                    .join("");

                galeriaHTML = `
                    <div class="gallery" id="gallery">

                        <img
                            class="gallery-main"
                            id="galleryMain"
                            src="${imagenes[0]}"
                            alt="${producto.nombre}"
                            draggable="false"
                        >

                        <button
                            type="button"
                            class="gallery-arrow prev"
                            id="galleryPrev"
                            aria-label="Imagen anterior"
                            ${imagenes.length <= 1 ? "disabled" : ""}
                        >
                            ‹
                        </button>

                        <button
                            type="button"
                            class="gallery-arrow next"
                            id="galleryNext"
                            aria-label="Imagen siguiente"
                            ${imagenes.length <= 1 ? "disabled" : ""}
                        >
                            ›
                        </button>

                        <div class="gallery-bottom">

                            <div
                                class="gallery-counter"
                                id="galleryCounter"
                            >
                                1 / ${imagenes.length}
                            </div>

                            <div class="gallery-thumbnails">
                                ${miniaturas}
                            </div>

                            <button
                                type="button"
                                class="zoom-button"
                                id="openZoom"
                            >
                                AMPLIAR
                            </button>

                        </div>

                    </div>

                    <div
                        class="zoom-modal"
                        id="zoomModal"
                        aria-hidden="true"
                    >

                        <button
                            type="button"
                            class="zoom-close"
                            id="zoomClose"
                            aria-label="Cerrar"
                        >
                            ×
                        </button>

                        <button
                            type="button"
                            class="zoom-nav prev"
                            id="zoomPrev"
                            aria-label="Imagen anterior"
                            ${imagenes.length <= 1 ? "style='display:none'" : ""}
                        >
                            ‹
                        </button>

                        <img
                            class="zoom-image"
                            id="zoomImage"
                            src="${imagenes[0]}"
                            alt="${producto.nombre}"
                            draggable="false"
                        >

                        <button
                            type="button"
                            class="zoom-nav next"
                            id="zoomNext"
                            aria-label="Imagen siguiente"
                            ${imagenes.length <= 1 ? "style='display:none'" : ""}
                        >
                            ›
                        </button>

                        <div class="zoom-controls">
                            <button
                                type="button"
                                class="zoom-control"
                                id="zoomOut"
                                aria-label="Alejar"
                            >
                                −
                            </button>

                            <button
                                type="button"
                                class="zoom-control"
                                id="zoomReset"
                                aria-label="Restablecer zoom"
                            >
                                1:1
                            </button>

                            <button
                                type="button"
                                class="zoom-control"
                                id="zoomIn"
                                aria-label="Acercar"
                            >
                                +
                            </button>
                        </div>

                    </div>
                `;

            }


            contenido.innerHTML = `

                <section class="product-page">

                    <div class="image-area">
                        ${galeriaHTML}
                    </div>


                    <div class="info-area">

                        <p class="category">
                            ${producto.categoria || "Producto"}
                        </p>

                        <h1 class="name">
                            ${producto.nombre}
                        </h1>

                        <div class="price">
                            $${precio}
                        </div>

                        <p class="description">
                            ${producto.descripcion || ""}
                        </p>


                        <p class="stock ${
                            stockDisponible
                                ? "available"
                                : "sold-out"
                        }">

                            ${
                                stockDisponible
                                    ? `EN STOCK (${producto.stock})`
                                    : "AGOTADO"
                            }

                        </p>


                        <div class="quantity-box">

                            <label for="cantidad">
                                CANTIDAD
                            </label>

                            <input
                                type="number"
                                id="cantidad"
                                value="1"
                                min="1"
                                max="${producto.stock}"
                                ${
                                    stockDisponible
                                        ? ""
                                        : "disabled"
                                }
                            >

                        </div>


                        <div class="buttons">

                            <button
                                class="btn cart-btn"
                                id="addCart"
                                ${
                                    stockDisponible
                                        ? ""
                                        : "disabled"
                                }
                            >
                                AGREGAR AL CARRITO
                            </button>


                            <button
                                class="btn favorite-btn"
                                id="addFavorite"
                            >
                                ♡ AGREGAR A FAVORITOS
                            </button>

                        </div>


                        <div
                            class="message"
                            id="message"
                        ></div>

                    </div>

                </section>

            `;


            const botonCarrito =
                document.getElementById("addCart");

            const botonFavorito =
                document.getElementById("addFavorite");

            const mensaje =
                document.getElementById("message");


            // =================================
            // GALERÍA / ZOOM
            // =================================

            if (imagenes.length > 0) {

                let indiceImagen = 0;
                let escalaZoom = 1;

                const galleryMain =
                    document.getElementById("galleryMain");

                const galleryPrev =
                    document.getElementById("galleryPrev");

                const galleryNext =
                    document.getElementById("galleryNext");

                const galleryCounter =
                    document.getElementById("galleryCounter");

                const openZoom =
                    document.getElementById("openZoom");

                const zoomModal =
                    document.getElementById("zoomModal");

                const zoomImage =
                    document.getElementById("zoomImage");

                const zoomClose =
                    document.getElementById("zoomClose");

                const zoomPrev =
                    document.getElementById("zoomPrev");

                const zoomNext =
                    document.getElementById("zoomNext");

                const zoomIn =
                    document.getElementById("zoomIn");

                const zoomOut =
                    document.getElementById("zoomOut");

                const zoomReset =
                    document.getElementById("zoomReset");


                function actualizarGaleria(nuevoIndice) {

                    if (nuevoIndice < 0) {
                        nuevoIndice =
                            imagenes.length - 1;
                    }

                    if (nuevoIndice >= imagenes.length) {
                        nuevoIndice = 0;
                    }

                    indiceImagen =
                        nuevoIndice;

                    galleryMain.src =
                        imagenes[indiceImagen];

                    zoomImage.src =
                        imagenes[indiceImagen];

                    galleryCounter.textContent =
                        (indiceImagen + 1) +
                        " / " +
                        imagenes.length;

                    document
                        .querySelectorAll(".gallery-thumb")
                        .forEach(
                            function (miniatura, indice) {

                                miniatura.classList.toggle(
                                    "active",
                                    indice === indiceImagen
                                );

                            }
                        );

                    escalaZoom = 1;
                    zoomImage.style.transform =
                        "scale(1)";

                }


                document
                    .querySelectorAll(".gallery-thumb")
                    .forEach(
                        function (miniatura) {

                            miniatura.addEventListener(
                                "click",
                                function () {

                                    actualizarGaleria(
                                        Number(
                                            miniatura.dataset.galleryIndex
                                        )
                                    );

                                }
                            );

                        }
                    );


                if (galleryPrev) {
                    galleryPrev.addEventListener(
                        "click",
                        function () {
                            actualizarGaleria(
                                indiceImagen - 1
                            );
                        }
                    );
                }


                if (galleryNext) {
                    galleryNext.addEventListener(
                        "click",
                        function () {
                            actualizarGaleria(
                                indiceImagen + 1
                            );
                        }
                    );
                }


                function abrirZoom() {

                    escalaZoom = 1;

                    zoomImage.style.transform =
                        "scale(1)";

                    zoomModal.classList.add(
                        "active"
                    );

                    zoomModal.setAttribute(
                        "aria-hidden",
                        "false"
                    );

                    document.body.style.overflow =
                        "hidden";

                }


                function cerrarZoom() {

                    zoomModal.classList.remove(
                        "active"
                    );

                    zoomModal.setAttribute(
                        "aria-hidden",
                        "true"
                    );

                    document.body.style.overflow =
                        "";

                    escalaZoom = 1;

                    zoomImage.style.transform =
                        "scale(1)";

                }


                galleryMain.addEventListener(
                    "click",
                    abrirZoom
                );

                openZoom.addEventListener(
                    "click",
                    abrirZoom
                );

                zoomClose.addEventListener(
                    "click",
                    cerrarZoom
                );


                zoomModal.addEventListener(
                    "click",
                    function (event) {

                        if (event.target === zoomModal) {
                            cerrarZoom();
                        }

                    }
                );


                if (zoomPrev) {
                    zoomPrev.addEventListener(
                        "click",
                        function () {
                            actualizarGaleria(
                                indiceImagen - 1
                            );
                        }
                    );
                }


                if (zoomNext) {
                    zoomNext.addEventListener(
                        "click",
                        function () {
                            actualizarGaleria(
                                indiceImagen + 1
                            );
                        }
                    );
                }


                function aplicarZoom() {

                    escalaZoom =
                        Math.min(
                            4,
                            Math.max(
                                1,
                                escalaZoom
                            )
                        );

                    zoomImage.style.transform =
                        "scale(" +
                        escalaZoom +
                        ")";

                }


                zoomIn.addEventListener(
                    "click",
                    function () {

                        escalaZoom += 0.5;
                        aplicarZoom();

                    }
                );


                zoomOut.addEventListener(
                    "click",
                    function () {

                        escalaZoom -= 0.5;
                        aplicarZoom();

                    }
                );


                zoomReset.addEventListener(
                    "click",
                    function () {

                        escalaZoom = 1;
                        aplicarZoom();

                    }
                );


                zoomModal.addEventListener(
                    "wheel",
                    function (event) {

                        event.preventDefault();

                        escalaZoom +=
                            event.deltaY < 0
                                ? 0.25
                                : -0.25;

                        aplicarZoom();

                    },
                    {
                        passive: false
                    }
                );


                document.addEventListener(
                    "keydown",
                    function (event) {

                        if (
                            !zoomModal.classList.contains(
                                "active"
                            )
                        ) {
                            return;
                        }

                        if (event.key === "Escape") {
                            cerrarZoom();
                        }

                        if (event.key === "ArrowLeft") {
                            actualizarGaleria(
                                indiceImagen - 1
                            );
                        }

                        if (event.key === "ArrowRight") {
                            actualizarGaleria(
                                indiceImagen + 1
                            );
                        }

                    }
                );


                let touchInicioX = 0;
                let touchFinX = 0;


                function manejarSwipe() {

                    const diferencia =
                        touchFinX - touchInicioX;

                    if (
                        Math.abs(diferencia) < 45
                    ) {
                        return;
                    }

                    if (diferencia < 0) {
                        actualizarGaleria(
                            indiceImagen + 1
                        );
                    } else {
                        actualizarGaleria(
                            indiceImagen - 1
                        );
                    }

                }


                const gallery =
                    document.getElementById("gallery");

                gallery.addEventListener(
                    "touchstart",
                    function (event) {

                        touchInicioX =
                            event.changedTouches[0]
                                .screenX;

                    },
                    {
                        passive: true
                    }
                );


                gallery.addEventListener(
                    "touchend",
                    function (event) {

                        touchFinX =
                            event.changedTouches[0]
                                .screenX;

                        manejarSwipe();

                    },
                    {
                        passive: true
                    }
                );

            }


            // =================================
            // CARRITO
            // =================================

            if (botonCarrito) {

                botonCarrito.addEventListener(
                    "click",
                    function () {

                        const cantidadInput =
                            document.getElementById("cantidad");


                        const cantidad =
                            Number(
                                cantidadInput.value
                            );


                        mensaje.className =
                            "message";

                        mensaje.textContent =
                            "";


                        if (
                            cantidad < 1 ||
                            cantidad >
                            Number(producto.stock)
                        ) {

                            mensaje.classList.add(
                                "error"
                            );

                            mensaje.textContent =
                                "Cantidad no válida.";

                            return;
                        }


                        let carrito =
                            JSON.parse(
                                localStorage.getItem(
                                    "carritoKYRO"
                                )
                            ) || [];


                        const existente =
                            carrito.find(
                                item =>
                                    Number(item.id) ===
                                    Number(producto.id)
                            );


                        if (existente) {

                            const nuevaCantidad =
                                Number(
                                    existente.cantidad
                                ) +
                                cantidad;


                            if (
                                nuevaCantidad >
                                Number(producto.stock)
                            ) {

                                mensaje.classList.add(
                                    "error"
                                );

                                mensaje.textContent =
                                    "No hay suficiente stock disponible.";

                                return;
                            }


                            existente.cantidad =
                                nuevaCantidad;

                        } else {

                            carrito.push({

                                id:
                                    producto.id,

                                nombre:
                                    producto.nombre,

                                categoria:
                                    producto.categoria,

                                precio:
                                    Number(
                                        producto.precio
                                    ),

                                imagen:
                                    producto.imagen,

                                stock:
                                    Number(
                                        producto.stock
                                    ),

                                cantidad:
                                    cantidad

                            });

                        }


                        localStorage.setItem(
                            "carritoKYRO",
                            JSON.stringify(
                                carrito
                            )
                        );


                        mensaje.classList.add(
                            "success"
                        );

                        mensaje.textContent =
                            "Producto agregado al carrito.";

                    }
                );

            }


            // =================================
            // FAVORITOS
            // =================================

            function obtenerFavoritos() {

                return (
                    JSON.parse(
                        localStorage.getItem(
                            "favoritosKYRO"
                        )
                    ) || []
                );

            }


            function guardarFavoritos(
                favoritos
            ) {

                localStorage.setItem(
                    "favoritosKYRO",
                    JSON.stringify(
                        favoritos
                    )
                );

            }


            function estaEnFavoritos() {

                const favoritos =
                    obtenerFavoritos();


                return favoritos.some(
                    item =>
                        Number(item.id) ===
                        Number(producto.id)
                );

            }


            function actualizarBotonFavorito() {

                if (estaEnFavoritos()) {

                    botonFavorito.textContent =
                        "♥ EN FAVORITOS";

                    botonFavorito.classList.add(
                        "active"
                    );

                } else {

                    botonFavorito.textContent =
                        "♡ AGREGAR A FAVORITOS";

                    botonFavorito.classList.remove(
                        "active"
                    );

                }

            }


            botonFavorito.addEventListener(
                "click",
                function () {

                    let favoritos =
                        obtenerFavoritos();


                    const indice =
                        favoritos.findIndex(
                            item =>
                                Number(item.id) ===
                                Number(producto.id)
                        );


                    mensaje.className =
                        "message";

                    mensaje.textContent =
                        "";


                    if (indice !== -1) {

                        favoritos.splice(
                            indice,
                            1
                        );


                        guardarFavoritos(
                            favoritos
                        );


                        mensaje.textContent =
                            "Producto eliminado de favoritos.";

                    } else {

                        favoritos.push({

                            id:
                                producto.id,

                            nombre:
                                producto.nombre,

                            categoria:
                                producto.categoria,

                            descripcion:
                                producto.descripcion,

                            precio:
                                Number(
                                    producto.precio
                                ),

                            imagen:
                                producto.imagen,

                            stock:
                                Number(
                                    producto.stock
                                )

                        });


                        guardarFavoritos(
                            favoritos
                        );


                        mensaje.classList.add(
                            "success"
                        );

                        mensaje.textContent =
                            "Producto agregado a favoritos.";

                    }


                    actualizarBotonFavorito();

                }
            );


            // Al abrir la página,
            // revisar si ya estaba guardado.

            actualizarBotonFavorito();

        }


        cargarProducto();

    </script>

</body>
</html>
