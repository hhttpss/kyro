    ========================== -->

    <!-- =========================
               HERO
    ========================== -->

        <!-- IZQUIERDA -->

            <div class="overlay"></div>


            <div class="hero-content">


                <p class="hero-small">
                    KYRO COLLECTION
                </p>


                <h1>
                    KYRO
                </h1>


                <a
                    href="catalogo.html"
                    class="hero-button"
                >
                    DESCUBRIR
                </a>


            </div>

        </section>



        <!-- DERECHA -->

        <section class="hero-panel hero-right">


            <div class="overlay"></div>


            <div class="hero-content">


                <p class="hero-small">
                    NEW DROP
                </p>


                <h1>
                    DROP 001
                </h1>


                <div class="hero-buttons">


                    <a
                        href="catalogo.html?filtro=nuevos"
                        class="hero-button"
                    >
                        EXPLORAR
                    </a>


                    <a
                        href="catalogo.html"
                        class="hero-button"

                        COMPRAR

    <!-- =========================
             FINAL
    ========================== -->

    <footer class="footer">

        <h2>
            KYRO
        </h2>

    </footer>



    <!-- TU JAVASCRIPT ACTUAL -->

    <script src="pagina.js"></script>



    <!-- =========================
          MENÚ MÓVIL JS
    ========================== -->

    <script>

        const mobileMenuButton =
            document.getElementById(
                "mobileMenuButton"
            );


        const mobileMenu =
            document.getElementById(
                "mobileMenu"
            );


        const mobileMenuClose =
            document.getElementById(
                "mobileMenuClose"
            );



        if (
            mobileMenuButton &&
            mobileMenu &&
            mobileMenuClose
        ) {


            // ABRIR

            mobileMenuButton.addEventListener(
                "click",
                function () {

                    mobileMenu.classList.add(
                        "active"
                    );


                    document.body.style.overflow =
                        "hidden";

                }
            );



            // CERRAR

            mobileMenuClose.addEventListener(
                "click",
                function () {

                    mobileMenu.classList.remove(
                        "active"
                    );


                    document.body.style.overflow =
                        "";

                }
            );



            // CERRAR AL TOCAR UN LINK

            mobileMenu
                .querySelectorAll("a")
                .forEach(
                    function (link) {

                        link.addEventListener(
                            "click",
                            function () {

                                mobileMenu.classList.remove(
                                    "active"
                                );


                                document.body.style.overflow =
                                    "";

                            }
                        );

                    }
                );

        }

    </script>


</body>

</html>
