<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo | KYRO</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f5;
            color: #111;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .topbar {
            height: 78px;
            background: #050505;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            padding: 0 30px;
        }

        .back {
            position: absolute;
            left: 30px;

            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -2px;
        }

        .catalog-header {
            padding: 70px 30px 35px;
        }

        .catalog-header p {
            font-size: 10px;
            letter-spacing: 2px;
            color: #777;
            margin-bottom: 12px;
        }

        .catalog-header h1 {
            font-size: 38px;
            font-weight: 500;
            letter-spacing: -1.5px;
        }

        .filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;

            padding: 0 30px 35px;
        }

        .filter-btn {
            border: 1px solid #111;
            background: transparent;

            padding: 10px 18px;

            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.8px;

            cursor: pointer;

            transition: 0.25s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #111;
            color: white;
        }

        .status {
            padding: 0 30px 20px;

            font-size: 12px;
            color: #666;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);

            gap: 8px;

            padding: 0 30px 70px;
        }

        .product-card {
            background: white;
            cursor: pointer;
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1 / 1.15;

            background: #e9e9e7;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .no-image {
            color: #999;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .product-info {
            padding: 15px 12px 18px;
        }

        .product-category {
            font-size: 9px;
            color: #888;

            text-transform: uppercase;

            letter-spacing: 1.1px;

            margin-bottom: 8px;
        }

        .product-name {
            font-size: 13px;
            font-weight: 600;

            margin-bottom: 7px;
        }

        .product-description {
            font-size: 11px;
            color: #666;
            line-height: 1.5;

            min-height: 32px;

            margin-bottom: 13px;
        }

        .product-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .product-price {
            font-size: 13px;
            font-weight: 700;
        }

        .stock {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.7px;
        }

        .stock.available {
            color: #166534;
        }

        .stock.sold-out {
            color: #b91c1c;
        }

        .empty {
            grid-column: 1 / -1;

            padding: 80px 20px;

            text-align: center;

            color: #777;
        }

        @media (max-width: 1000px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .topbar {
                height: 65px;
            }

            .back {
                left: 18px;
            }

            .logo {
                font-size: 25px;
            }

            .catalog-header {
                padding: 50px 16px 25px;
            }

            .filters {
                padding: 0 16px 25px;
            }

            .status {
                padding: 0 16px 15px;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);

                padding: 0 8px 50px;

                gap: 5px;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">

        <a href="index.html" class="back">
            ← VOLVER
        </a>

        <a href="index.html" class="logo">
            KYRO
        </a>

    </header>


    <section class="catalog-header">

        <p>KYRO STORE</p>

        <h1 id="catalogTitle">
            VER TODO
        </h1>

    </section>


    <div class="filters" id="filters">

        <button
            class="filter-btn active"
            data-filter="todos"
        >
            TODO
        </button>

        <button
            class="filter-btn"
            data-filter="stock"
        >
            EN STOCK
        </button>

        <button
            class="filter-btn"
            data-filter="nuevos"
        >
            NEW DROP
        </button>

    </div>


    <div class="status" id="status">
        Cargando productos...
    </div>


    <main
        class="products-grid"
        id="productsGrid"
    ></main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://nhdjeagtkziidkiewttf.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_65y75qbjj3WJxlSEG4d6Nw_8ipgOePE";


        const clienteSupabase =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const grid =
            document.getElementById(
                "productsGrid"
            );

        const status =
            document.getElementById(
                "status"
            );

        const catalogTitle =
            document.getElementById(
                "catalogTitle"
            );


        let productos = [];


        // ==================================
        // LEER PARÁMETROS DE LA URL
        // ==================================

        const params =
            new URLSearchParams(
                window.location.search
            );

        const filtroInicial =
            params.get("filtro");

        const busquedaInicial =
            params.get("buscar");


        // ==================================
        // CARGAR PRODUCTOS DE SUPABASE
        // ==================================

        async function cargarProductos() {

            status.textContent =
                "Cargando productos...";


            const { data, error } =
                await clienteSupabase
                    .from("produtos")
                    .select("*")
                    .eq("activo", true)
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            if (error) {

                console.error(error);

                status.textContent =
                    "No se pudieron cargar los productos.";

                return;
            }


            productos = data || [];


            if (busquedaInicial) {

                aplicarBusqueda(
                    busquedaInicial
                );

                return;
            }


            if (
                filtroInicial ===
                "stock"
            ) {

                activarBoton(
                    "stock"
                );

                mostrarProductos(
                    productos.filter(
                        producto =>
                            producto.stock > 0
                    )
                );

                catalogTitle.textContent =
                    "EN STOCK";

                return;
            }


            if (
                filtroInicial ===
                "nuevos"
            ) {

                activarBoton(
                    "nuevos"
                );

                mostrarProductos(
                    productos.slice(0, 12)
                );

                catalogTitle.textContent =
                    "NEW DROP";

                return;
            }


            mostrarProductos(
                productos
            );

        }


        // ==================================
        // MOSTRAR PRODUCTOS
        // ==================================

        function mostrarProductos(lista) {

            grid.innerHTML = "";


            if (lista.length === 0) {

                status.textContent =
                    "0 productos";

                grid.innerHTML = `
                    <div class="empty">
                        No encontramos productos.
                    </div>
                `;

                return;
            }


            status.textContent =
                lista.length +
                (
                    lista.length === 1
                        ? " producto"
                        : " productos"
                );


            lista.forEach(
                producto => {

                    const card =
                        document.createElement(
                            "article"
                        );


                    card.className =
                        "product-card";


                    const precio =
                        Number(
                            producto.precio
                        ).toFixed(2);


                    const stockTexto =
                        producto.stock > 0
                            ? `EN STOCK (${producto.stock})`
                            : "AGOTADO";


                    const stockClase =
                        producto.stock > 0
                            ? "available"
                            : "sold-out";


                    let imagenHTML = `
                        <span class="no-image">
                            SIN IMAGEN
                        </span>
                    `;


                    if (producto.imagen) {

                        imagenHTML = `
                            <img
                                src="${producto.imagen}"
                                alt="${producto.nombre}"
                            >
                        `;

                    }


                    card.innerHTML = `

                        <div class="product-image">
                            ${imagenHTML}
                        </div>

                        <div class="product-info">

                            <p class="product-category">
                                ${producto.categoria || "Producto"}
                            </p>

                            <h2 class="product-name">
                                ${producto.nombre}
                            </h2>

                            <p class="product-description">
                                ${producto.descripcion || ""}
                            </p>

                            <div class="product-bottom">

                                <span class="product-price">
                                    $${precio}
                                </span>

                                <span class="stock ${stockClase}">
                                    ${stockTexto}
                                </span>

                            </div>

                        </div>

                    `;


                    card.addEventListener(
                        "click",
                        function () {

                            window.location.href =
                                "producto.html?id=" +
                                producto.id;

                        }
                    );


                    grid.appendChild(
                        card
                    );

                }
            );

        }


        // ==================================
        // FILTROS
        // ==================================

        document
            .querySelectorAll(
                ".filter-btn"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        function () {

                            const filtro =
                                this.dataset.filter;


                            activarBoton(
                                filtro
                            );


                            if (
                                filtro ===
                                "stock"
                            ) {

                                catalogTitle.textContent =
                                    "EN STOCK";

                                mostrarProductos(
                                    productos.filter(
                                        producto =>
                                            producto.stock > 0
                                    )
                                );

                                return;
                            }


                            if (
                                filtro ===
                                "nuevos"
                            ) {

                                catalogTitle.textContent =
                                    "NEW DROP";

                                mostrarProductos(
                                    productos.slice(
                                        0,
                                        12
                                    )
                                );

                                return;
                            }


                            catalogTitle.textContent =
                                "VER TODO";

                            mostrarProductos(
                                productos
                            );

                        }
                    );

                }
            );


        function activarBoton(
            filtro
        ) {

            document
                .querySelectorAll(
                    ".filter-btn"
                )
                .forEach(
                    boton => {

                        boton.classList.remove(
                            "active"
                        );

                    }
                );


            const activo =
                document.querySelector(
                    `[data-filter="${filtro}"]`
                );


            if (activo) {

                activo.classList.add(
                    "active"
                );

            }

        }


        // ==================================
        // BÚSQUEDA
        // ==================================

        function aplicarBusqueda(
            texto
        ) {

            const busqueda =
                texto
                    .toLowerCase()
                    .trim();


            catalogTitle.textContent =
                `RESULTADOS PARA "${texto}"`;


            const resultados =
                productos.filter(
                    producto => {

                        const nombre =
                            (
                                producto.nombre ||
                                ""
                            ).toLowerCase();

                        const categoria =
                            (
                                producto.categoria ||
                                ""
                            ).toLowerCase();

                        const descripcion =
                            (
                                producto.descripcion ||
                                ""
                            ).toLowerCase();


                        return (
                            nombre.includes(
                                busqueda
                            ) ||
                            categoria.includes(
                                busqueda
                            ) ||
                            descripcion.includes(
                                busqueda
                            )
                        );

                    }
                );


            mostrarProductos(
                resultados
            );

        }


        cargarProductos();

    </script>

</body>
</html>
