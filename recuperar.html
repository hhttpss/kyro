<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña | KYRO</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: white;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .topbar {
            height: 78px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #222;
            position: relative;
        }

        .back {
            position: absolute;
            left: 30px;
            font-size: 11px;
            font-weight: 700;
        }

        .logo {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -2px;
        }

        .page {
            min-height: calc(100vh - 78px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .box {
            width: 100%;
            max-width: 430px;
        }

        .box p {
            font-size: 10px;
            color: #888;
            letter-spacing: 2px;
            margin-bottom: 14px;
        }

        .box h1 {
            font-size: 36px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .description {
            display: block;
            color: #aaa;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 50px;
            background: transparent;
            border: none;
            border-bottom: 1px solid #555;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-bottom-color: white;
        }

        button {
            width: 100%;
            height: 52px;
            margin-top: 30px;
            background: white;
            color: black;
            border: 1px solid white;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: transparent;
            color: white;
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 12px;
            font-size: 12px;
        }

        .message.success {
            display: block;
            border: 1px solid #236b35;
            color: #b9ffc7;
        }

        .message.error {
            display: block;
            border: 1px solid #6b2525;
            color: #ffb4b4;
        }
    </style>
</head>

<body>

    <header class="topbar">

        <a href="login.html" class="back">
            ← VOLVER
        </a>

        <a href="index.html" class="logo">
            KYRO
        </a>

    </header>

    <main class="page">

        <section class="box">

            <p>KYRO ACCOUNT</p>

            <h1>RECUPERAR CONTRASEÑA</h1>

            <span class="description">
                Ingresa tu correo y te enviaremos un enlace
                para crear una contraseña nueva.
            </span>

            <form id="recoveryForm">

                <label for="correo">
                    CORREO ELECTRÓNICO
                </label>

                <input
                    type="email"
                    id="correo"
                    required
                >

                <button type="submit" id="sendButton">
                    ENVIAR ENLACE
                </button>

            </form>

            <div
                id="message"
                class="message"
            ></div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://nhdjeagtkziidkiewttf.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_65y75qbjj3WJxlSEG4d6Nw_8ipgOePE";

        const clienteSupabase =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const form =
            document.getElementById("recoveryForm");

        const message =
            document.getElementById("message");

        const sendButton =
            document.getElementById("sendButton");


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const correo =
                    document
                        .getElementById("correo")
                        .value
                        .trim();


                message.className = "message";
                message.textContent = "";

                sendButton.disabled = true;

                sendButton.textContent =
                    "ENVIANDO...";


                const { error } =
                    await clienteSupabase.auth
                        .resetPasswordForEmail(
                            correo,
                            {
                                redirectTo:
                                    window.location.origin +
                                    "/nueva-contrasena.html"
                            }
                        );


                if (error) {

                    console.error(error);

                    message.classList.add("error");

                    message.textContent =
                        "No se pudo enviar el correo.";

                    sendButton.disabled = false;

                    sendButton.textContent =
                        "ENVIAR ENLACE";

                    return;
                }


                message.classList.add("success");

                message.textContent =
                    "Te enviamos un enlace. Revisa tu correo.";

                sendButton.disabled = false;

                sendButton.textContent =
                    "ENVIAR ENLACE";

            }
        );

    </script>

</body>
</html>
